version = "0.1.0"
description = "A prototype"
readme = "README.md"
authors = [
    { name = "Abhijit Pardeshi", email = "abhijit.9@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
